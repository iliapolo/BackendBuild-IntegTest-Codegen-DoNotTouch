version: 1
backend:
  phases:
    # ADD THIS
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install -g @aws-amplify/cli@14.4.0-rc.0363a26e55df110.0
    # END
    build:
      commands:
        - amplifyPush --simple
frontend:
  phases:
    build:
      commands:
        - echo "true"
  artifacts:
    baseDirectory: src
    files:
      - "**/*"
